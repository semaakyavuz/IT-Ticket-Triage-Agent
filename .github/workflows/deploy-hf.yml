name: Deploy to Hugging Face Space

# CI (pytest) main'de yesil gecince repo'yu Space'in git remote'una push eder.
# Gereken ayarlar (GitHub repo > Settings):
#   - Secret  HF_TOKEN : Hugging Face erisim token'i (write yetkili)
#   - Variable HF_SPACE: "<hf-kullanici-adi>/<space-adi>"
# Ikisi de tanimli degilse workflow hata vermeden atlanir.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Push to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN secret'i veya HF_SPACE variable'i tanimli degil; deploy atlandi."
            exit 0
          fi
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
